function startPeriod(ds) {
  if (!ds || ds > todayStr()) { toast('미래 날짜는 기록할 수 없어요'); return false; }
  const exists = S.periods.some(p => p.start === ds);
  if (exists) { toast('이미 생리 시작일로 기록되어 있어요'); return false; }
  const prev = S.periods.filter(p => p.start < ds).sort((a, b) => (a.start < b.start ? 1 : -1))[0];
  if (prev && !prev.end && diff(prev.start, ds) <= 12) {
    askConfirm({
      title: '이전 생리 기록이 열려 있어요',
      desc: fmtKo(prev.start) + '에 시작한 기록의 종료일이 없습니다. 그 기록을 ' + fmtKo(ds) + ' 하루 전으로 마감하고 새로 시작할까요?',
      ok: '마감 후 시작',
      onOk: () => { prev.end = ymd(addDays(parse(ds), -1)); S.periods.push({ start: ds, end: null }); save(); render(); closeSheet(); toast('생리를 기록했어요'); }
    });
    return true;   // 확인 창을 띄웠으니 날짜 시트를 다시 그리지 않습니다
  }
  S.periods.push({ start: ds, end: null });
  S.periods.sort((a, b) => (a.start < b.start ? -1 : 1));
  save(); render();
  toast(fmtKo(ds) + ' 생리 시작을 기록했어요');
  return false;
}
function endPeriod(ds) {
  const op = openPeriod();
  if (!op) { toast('진행 중인 생리 기록이 없어요'); return; }
  if (ds < op.start) { toast('시작일보다 빠른 날짜예요'); return; }
  op.end = ds;
  S.daily[ds] = Object.assign({}, S.daily[ds], { flow: (S.daily[ds] && S.daily[ds].flow) || 'light' });
  save(); render();
  toast(fmtKo(ds) + ' 생리 종료를 기록했어요');
}
function deletePeriod(ds) {
  const targets = S.periods.filter(p => p.start <= ds && (p.end ? ds <= p.end : diff(p.start, ds) <= 9));
  if (!targets.length) return;
  askConfirm({
    title: '생리 기록을 삭제할까요?',
    desc: targets.length === 1 ? fmtKo(targets[0].start) + ' 시작 기록이 삭제됩니다.' : targets.length + '개의 기록이 삭제됩니다.',
    ok: '삭제', danger: true,
    onOk: () => { S.periods = S.periods.filter(p => !targets.includes(p)); save(); render(); closeSheet(); toast('삭제했어요'); }
  });
}
function cleanToggle(ds, askImprove) {
  if (ds > todayStr()) return;
  const i = S.cleansings.findIndex(c => c.date === ds);
  if (i >= 0) { S.cleansings.splice(i, 1); toast('사용 기록을 취소했어요'); }
  else {
    S.cleansings.push({ date: ds, at: new Date().toISOString() });
    toast(fmtKo(ds) + ' 사용 완료로 기록했어요 💧');
  }
  save(); render();
  if (sheetDate === ds && document.getElementById('sheet').classList.contains('open')) drawDaySheet();
  if (typeof dbPushCleansing === 'function') dbPushCleansing(ds);
  if (askImprove && i < 0 && typeof openImprove === 'function') setTimeout(() => openImprove(ds), 260);
}
function saveDaily() {
  if (!sheetDate || sheetDate > todayStr()) return;
  const cur = S.daily[sheetDate] || {};
  const next = Object.assign({}, cur, form);
  if (!form.flow) delete next.flow;
  if (form.pain == null) delete next.pain;
  if (!form.discharge) delete next.discharge;
  if (!form.mood) delete next.mood;
  if (!form.water) delete next.water; else next.water = form.water;
  if (form.dry == null) delete next.dry; else next.dry = form.dry;
  if (form.itch == null) delete next.itch; else next.itch = form.itch;
  if (form.smell == null) delete next.smell; else next.smell = form.smell;
  if (!form.memo) delete next.memo; else next.memo = form.memo;
  if (hasLog(next)) S.daily[sheetDate] = next; else delete S.daily[sheetDate];
  save(); render();
  toast('기록을 저장했어요');
  closeSheet();

function importData(file) {

      if (!p || typeof p !== 'object' || (!p.periods && !p.settings && !p.daily)) throw new Error('bad');
      askConfirm({

function sampleData() {
  askConfirm({
    title: '샘플 데이터로 체험할까요?',
    desc: '지금 기록이 있으면 샘플 데이터로 바뀝니다. 먼저 내보내기로 백업해 두세요.',
    ok: '체험하기',
    onOk: () => {
      const today = new Date();
      const lastStart = addDays(today, -12);
      const starts = [];
      let s = addDays(lastStart, -(28 + 27 + 29 + 30));
      const gaps = [30, 29, 27, 28];
      for (let i = 0; i < 4; i++) { starts.push(new Date(s)); s = addDays(s, gaps[i]); }
      starts.push(lastStart);
      const periods = starts.map(d => ({ start: ymd(d), end: ymd(addDays(d, 4)) }));
      const daily = {};
      const flows = ['light', 'medium', 'heavy', 'medium', 'light'];
      periods.forEach((p, i) => {
        for (let k = 0; k < 5; k++) {
          const d = ymd(addDays(parse(p.start), k));
          if (d > todayStr()) continue;
          daily[d] = { flow: flows[k], pain: k < 2 ? 2 : 1, mood: k < 2 ? 'tired' : 'calm', water: 4 + (k % 3) };
        }
      });
      for (let i = 0; i < 24; i++) {
        const d = ymd(addDays(today, -i));
        if (daily[d]) continue;
        daily[d] = { mood: i % 5 === 0 ? 'sensitive' : i % 3 === 0 ? 'good' : 'calm', water: 4 + (i % 5), discharge: i % 7 === 0 ? '정상(투명·유백색)' : '' };
      }
      const cleansings = [];
      for (let w = 0; w < 6; w++) {
        const ws = addDays(weekStartOf(today), -7 * w);
        const d = addDays(ws, 4);
        if (ymd(d) <= todayStr()) cleansings.push({ date: ymd(d), at: ymd(d) + 'T21:10:00' });
      }
      S = Object.assign(DEF(), {
        settings: Object.assign(DEF().settings, { cycleLength: 28, periodLength: 5, productName: '니엔뜨 샤이닝', seenIntro: true }),
        periods, daily, cleansings,
        bookmarks: ['v2', 'u4', 'b2'], read: ['v1', 'v3'], notified: {}
      });
      save(true); invalidate(); render(); closeSheet();
      toast('샘플 데이터를 불러왔어요');
    }
  });
}

function surveyConcerns(V) {

if (sym.some(s => s.includes('통증'))) out.add('통증');
if ((V.smell || []).some(s => s !== '무취')) out.add('냄새');
if ((V.color || []).length) out.add('분비물');
if ((V.conditions || []).some(c => c.includes('질염'))) out.add('질염 재발');
if ((V.conditions || []).includes('방광염')) out.add('방광염');
if ((V.conditions || []).includes('생리통')) out.add('생리통');
if ((V.conditions || []).includes('질건조증')) out.add('질건조증');
if (V.hysterectomy === '예') out.add('자궁적출 후 케어');
if (V.cleanser === '사용 중') out.add('청결 관리');
if (V.hormone === '예' || V.menstruation === '완경(폐경) 후 월경 중지') out.add('완경 케어');

function csvEscape(v) {
const s = String(v == null ? '' : v);
return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportMembersCsv() {
  const st = adminStats();
  const list = filterMembers(st).filter(m => m.marketing);
  if (!list.length) { toast('마케팅 수신에 동의한 회원이 없어요'); return; }
  const head = ['이름', '출생연도', '연령대', '모드', '연락처', '마케팅동의', '가입일', '주요고민', '설문참여', '개선도기록'];
  const rows = list.map(m => [
    m.name || '', m.birthYear || '', ageBand(m.birthYear), modeName(m.mode),
    m.contact || '', 'Y', m.joinedAt || '', (m.concerns || []).join('/'), (m.surveyCount || 0) > 0 ? 'Y' : 'N', (m.imp || []).length
  ]);
  const csv = '\uFEFF' + [head].concat(rows).map(r => r.map(csvEscape).join(',')).join('\r\n');
  try {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = '니엔뜨_마케팅동의회원_' + todayStr() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(list.length + '명의 회원을 CSV로 내보냈어요');
  } catch (e) { toast('CSV를 만들지 못했어요'); }
  if (typeof dbPushEvent === 'function') dbPushEvent('csv_export', { count: list.length });
}

    supaReq('articles', { method: 'POST', prefer: 'return=minimal', body: {
      id: art.id, cat: art.cat, title: art.title, lead: art.lead, body: art.body, tip: art.tip,
      published: true, created_at: art.createdAt
    } });
  }
}
function toggleArticle(id) {
  const a = (S.customArticles || []).find(x => x.id === id);
  if (!a) return;
  a.published = a.published === false;
  save(true); invalidateInfo(); renderInfo(); drawAdmin();
  toast(a.published === false ? '글을 숨겼어요' : '글을 게시했어요');
  if (supaCfg().on) supaReq('articles', { method: 'PATCH', query: 'id=eq.' + encodeURIComponent(id), prefer: 'return=minimal', body: { published: a.published } });
}
function deleteArticle(id) {
  const a = (S.customArticles || []).find(x => x.id === id);
  if (!a) return;
  askConfirm({
    title: '글을 삭제할까요?', desc: '"' + a.title + '" 글이 삭제됩니다. 되돌릴 수 없어요.', ok: '삭제', danger: true,
    onOk: () => {
      S.customArticles = S.customArticles.filter(x => x.id !== id);
      save(true); invalidateInfo(); renderInfo(); drawAdmin(); toast('삭제했어요');
      if (supaCfg().on) supaReq('articles', { method: 'DELETE', query: 'id=eq.' + encodeURIComponent(id) });
    }
  });
}
/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  switch (act) {
    case 'admin:close': if (ADMIN) ADMIN.pinOk = false; closeSheet(); break;
    case 'admin:key': {
      if (v === 'ok') {
        if (ADMIN.buf === String(S.settings.adminPin)) { ADMIN.pinOk = true; ADMIN.buf = ''; ADMIN.err = ''; drawAdmin(); }
        else { ADMIN.err = 'PIN이 맞지 않아요'; ADMIN.buf = ''; drawAdmin(); }
      } else if (ADMIN.buf.length < 4) {
        ADMIN.buf += v; ADMIN.err = '';
        if (ADMIN.buf.length === 4) {
          if (ADMIN.buf === String(S.settings.adminPin)) { setTimeout(() => { ADMIN.pinOk = true; ADMIN.buf = ''; drawAdmin(); }, 140); }
          else setTimeout(() => { ADMIN.err = 'PIN이 맞지 않아요'; ADMIN.buf = ''; drawAdmin(); }, 240);
        } else drawAdmin();
      }
      break;
    }
    case 'admin:clear': ADMIN.buf = ''; ADMIN.err = ''; drawAdmin(); break;
    case 'admin:tab': ADMIN.tab = v; drawAdmin(); break;
    case 'admin:filter': ADMIN.filter = v; drawAdmin(); break;
    case 'admin:csv': exportMembersCsv(); break;
    case 'admin:art-save': saveArticle(); break;
    case 'admin:art-toggle': toggleArticle(id); break;
    case 'admin:art-del': deleteArticle(id); break;
    case 'admin:pin-save': {
      const el2 = document.getElementById('adPin');
      const pin = el2 ? el2.value.trim() : '';
      if (!/^\d{4}$/.test(pin)) { toast('4자리 숫자를 입력해 주세요'); break; }
      S.settings.adminPin = pin; save(true); drawAdmin(); toast('PIN을 변경했어요');
      break;
    }
    case 'admin:sb-save': {
      const u = document.getElementById('sbUrl'), k = document.getElementById('sbKey');
      setSupabase(u ? u.value : '', k ? k.value : '');
      drawAdmin();
      break;
    }
    case 'admin:reseed': {
      S.members = []; seedDemoMembers(); drawAdmin(); toast('데모 회원을 다시 만들었어요');
      break;
    }
  }
});
/* 회원 검색 */
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'adminQ') {
    ADMIN.q = e.target.value;
    clearTimeout(window.__adminQT);
    window.__adminQT = setTimeout(() => {
      drawAdmin();
      const el = document.getElementById('adminQ');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 220);
  }
});
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
